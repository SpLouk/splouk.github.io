---
layout: default
---
<h1>Posts tagged “{{ page.title }}”</h1>

<ul class="post-title-list">
  {% for post in page.posts %}
  <li >
    <div>
      <a href="{{ post.url }}"> {{ post.title }} </a>
      <p class="post-description">
      {{post.description}}
      </p>
    </div>
    <p class="article-list-date">{{ post.date | date: "%B %-d, %Y" }}</p>
  </li>
  {% endfor %}
</ul>
