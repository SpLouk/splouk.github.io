<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      {% if page.title %}{{ page.title }} – Loukidelis.com{% else
      %}Loukidelis.com{% endif %}
    </title>
    <!-- OpenGraph -->
    <meta property="og:site_name" content="{{ title }}">
    <meta property="og:type" content="{% if page.layout == 'article' %}article{% else %}website{% endif %}">
    <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{title}}{% endif %}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
    {% if page.og_image or site.og_image %}
      <meta property="og:image" content="{% if page.og_image %}{{ page.og_image }}{% else %}{{ site.og_image }}{% endif %}">
    {% endif %}
    <meta property="og:locale" content="{{ site.lang }}">

    <link href="/assets/css/styles.css" rel="stylesheet" />
  </head>
  <body>
    <img
      class="background-image"
      srcset="
        /assets/images/header-small.jpg 1280w,
        /assets/images/header.jpg       2685w
      "
      sizes="(max-width: 1000px) 1280px, 2685px"
      src="/assets/images/header.jpg"
    />
    <header>
      <a class="home-link" href="/index.html">
        <p class="home-link-title">David Loukidelis</p>
      </a>
    </header>
    <main>{{ content }}</main>
    <footer>
      <a href="/feed.xml" target="_blank">Atom feed</a>
      <a href="https://www.lipchenko.com/" target="_blank">Art by Oleg Lipchenko</a>
    </footer>
  </body>
</html>
