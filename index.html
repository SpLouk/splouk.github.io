---
layout: default
title: Loukidelis.com
---

<ul class="main-nav">
  {% for post in paginator.posts %}
  <li>
    <div>
      <a class="article-link" href="{{ post.url }}"> {{ post.title }} </a>
      <p class="article-date">{{ post.date | date: "%B %-d, %Y" }}</p>
    </div>
    {{post.excerpt}}
    <a style="display: block; text-align: center; margin: 2rem 0;" href="{{ post.url }}">Keep reading</a>
  </li>
  {% endfor %}
</ul>
